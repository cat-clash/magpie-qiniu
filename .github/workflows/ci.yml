name: CI

on:
  push:
  pull_request:

# 矩阵只跑 ubuntu-latest：本工程零运行时依赖，Windows 侧由下方的 pwsh 语法校验步骤覆盖。
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node@4（Node.js 22）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 本工程零运行时依赖（package.json 无 dependencies）：无需 npm install / npm ci。

      - name: 语法检查（全部 .mjs）
        shell: bash
        run: |
          node --check plugin/index.mjs
          for f in plugin/src/*.mjs; do node --check "$f"; done

      - name: 冒烟自检
        run: node plugin/tests/smoke.mjs

      - name: 插件单元测试
        run: node --test plugin/tests/*.test.mjs

      # 宿主侧体检的「工具链自检」：CI 机器上没有 magpie、也没有 ~/.config/magpie，
      # 所以用 tests/fixtures/ 下的两套假配置喂给 check（check 本身零网络、不碰真配置）。
      # MAGPIE_BIN 指 /bin/true：CI 里没有 magpie 二进制，若不指桩，check 会稳定报
      # magpie-binary=warn，而 summarize 把 warn 也算「非 ok」，ok fixture 的退出码会变成 1。
      - name: 宿主侧体检 check（坏 fixture 必须报错）
        env:
          MAGPIE_BIN: /bin/true
        run: |
          set +e
          node tools/check.mjs --config-dir tests/fixtures/magpie-broken --json > /tmp/check-broken.json
          broken=$?
          node tools/check.mjs --config-dir tests/fixtures/magpie-ok --json > /tmp/check-ok.json
          ok=$?
          set -e
          echo "broken exit=$broken (期望 1)  ok exit=$ok (期望 0)"
          test "$broken" = "1"
          test "$ok" = "0"
      - name: 契约漂移检测（必须零差集）
        run: node scripts/contract-diff.mjs

      - name: 安装器端到端测试
        run: node --test tests/e2e/installer.test.mjs

      - name: install.sh 语法
        run: bash -n install.sh

      - name: install.sh --help
        run: bash install.sh --help

      # 用桩代替真 magpie：dry-run 本身不调用宿主，这里只保证定位阶段不误装。
      - name: install.sh --dry-run
        env:
          MAGPIE_BIN: /bin/true
        run: bash install.sh --dry-run

      - name: install.ps1 语法校验
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('./install.ps1', [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
