<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出站闸 · 七牛云 Qiniu AI</title>
<!-- 面板契约（magpie.panels，slot: provider）：
     1) 必须引宿主的 _magpie/bridge.js，否则拿不到 magpie.options / magpie.theme；
        且它必须排在 gates.js **之前**：本面板脚本是 defer 的外链，bridge 是同步脚本，
        顺序写反了会在 magpie 还没就绪时就去读 options，面板一片空白。
     2) 只能引本目录内的文件，不许外链、不许发请求 —— 离线可用。
     3) 值只在按「保存」时写一次（options.set 整份替换 + 一秒最多一次），
        输入事件不做即时写回；取消按钮按磁盘值重画。 -->
<link rel="stylesheet" href="gates.css">
<script src="_magpie/bridge.js"></script>
<script src="gates.js" defer></script>
</head>
<body>

<div class="gates-root">
  <form id="gates-form" class="gates-form" novalidate>

    <header class="gates-head">
      <h2 class="gates-title" id="gates-title">出站闸</h2>
      <span class="gates-version" id="gates-version">qiniu-ai · 1.3.0</span>
    </header>

    <!-- 节奏闸：按账号拉开最小间隔，再叠一层随机抖动 -->
    <div class="gates-group">
      <h3 class="gates-group-title" id="gates-group-pacing">节奏闸</h3>

      <label class="gates-row" for="pacingMinMs">
        <span class="gates-label" id="gates-label-pacing">最小间隔 pacingMinMs</span>
        <input class="gates-input gates-num" id="pacingMinMs" name="pacingMinMs" type="number"
               min="0" max="60000" step="50" inputmode="numeric" autocomplete="off">
        <span class="gates-unit" id="gates-unit-pacing">ms</span>
      </label>

      <label class="gates-row" for="pacingJitterMs">
        <span class="gates-label" id="gates-label-jitter">抖动上限 pacingJitterMs</span>
        <input class="gates-input gates-num" id="pacingJitterMs" name="pacingJitterMs" type="number"
               min="0" max="60000" step="50" inputmode="numeric" autocomplete="off">
        <span class="gates-unit" id="gates-unit-jitter">ms</span>
      </label>
    </div>

    <!-- 账号级熔断：连续失败到阈值就本地停一段时间；阈值 0 = 禁用 -->
    <div class="gates-group">
      <h3 class="gates-group-title" id="gates-group-breaker">熔断</h3>

      <label class="gates-row" for="breakerThreshold">
        <span class="gates-label" id="gates-label-breaker">熔断阈值 breakerThreshold</span>
        <input class="gates-input gates-num" id="breakerThreshold" name="breakerThreshold" type="number"
               min="0" max="100" step="1" inputmode="numeric" autocomplete="off">
        <span class="gates-unit" id="gates-unit-breaker">次</span>
      </label>

      <label class="gates-row" for="breakerCooldownMs">
        <span class="gates-label" id="gates-label-cooldown">熔断冷却 breakerCooldownMs（按分钟填）</span>
        <input class="gates-input gates-num" id="breakerCooldownMs" name="breakerCooldownMs" type="number"
               min="1" max="480" step="1" inputmode="numeric" autocomplete="off">
        <span class="gates-unit" id="gates-unit-cooldown">分钟</span>
      </label>
    </div>

    <!-- 账号切换：402 / 欠费 403 改写成 429，让宿主换下一个账号 -->
    <div class="gates-group">
      <h3 class="gates-group-title" id="gates-group-failover">账号切换</h3>

      <label class="gates-row gates-row-bool" for="quotaFailover">
        <span class="gates-label" id="gates-label-failover">额度用尽即换号 quotaFailover</span>
        <input class="gates-input gates-check" id="quotaFailover" name="quotaFailover" type="checkbox">
      </label>
    </div>

    <!-- 缓存：用量接口读得勤会撞上游 QPS 限制 -->
    <div class="gates-group">
      <h3 class="gates-group-title" id="gates-group-cache">缓存</h3>

      <label class="gates-row" for="usageCacheMs">
        <span class="gates-label" id="gates-label-cache">用量缓存 usageCacheMs（按秒填）</span>
        <input class="gates-input gates-num" id="usageCacheMs" name="usageCacheMs" type="number"
               min="10" max="600" step="1" inputmode="numeric" autocomplete="off">
        <span class="gates-unit" id="gates-unit-cache">秒</span>
      </label>
    </div>

    <p class="gates-status" id="gates-status" role="status" aria-live="polite">读取中…</p>

    <!-- 只读状态区：纯展示，任何一项都不会写回 options -->
    <section class="gates-readonly" id="gates-readonly" aria-label="面板状态">
      <p class="gates-readonly-title" id="gates-effective-title">当前生效值</p>
      <p class="gates-effective" id="gates-effective" aria-live="polite"></p>
      <p class="gates-versionline" id="gates-versionline"></p>
      <p class="gates-hint" id="gates-hint">
        options.set 是整份替换：本面板只管理这六个键，其余选项请直接改 plugins.json 里的插件选项。
      </p>
    </section>

    <p class="gates-note" id="gates-note">
      pacingMinMs 设 0 且 pacingJitterMs 也设 0 才是完全直通；breakerThreshold 设 0 = 禁用熔断。
      冷却按分钟、缓存按秒填写，写回一律是毫秒。保存后下一个请求起生效。
    </p>

    <div class="gates-actions">
      <button class="gates-btn" id="gates-cancel" type="submit" name="action" value="cancel">取消</button>
      <button class="gates-btn gates-primary" id="gates-save" type="submit" name="action" value="save">保存</button>
    </div>

  </form>
</div>

</body>
</html>
